<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evokai Stone Homepage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a dark temple wall. One question at the top, one row of work, two links at the bottom. The cursor is the only light source. */
:root{
  --bg:#07090B; --fg:#ECE6D8; --fg2:#9B9484; --line:rgba(236,230,216,.14); --ember:#FF9A3C; --ember2:#FFD58A;
  --f-display:"ITC Avant Garde Gothic Std","ITC Avant Garde Gothic","Outfit","Century Gothic",system-ui,sans-serif;
  --f-body:"Futura PT","Futura","Jost","Century Gothic",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--fg); font:400 16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100dvh; cursor:none}
a,button{cursor:none}
img,video{max-width:100%} [hidden]{display:none!important}
a{color:inherit; text-decoration:none} button{font:inherit; color:inherit; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--ember); outline-offset:4px}
@media (hover:none){ body,a,button{cursor:auto} }

#wall{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block}
#page{position:relative; z-index:2; min-height:100dvh; display:flex; flex-direction:column; pointer-events:none}
#page header, #page .rail, #page footer{pointer-events:auto}
#wallLink{position:fixed; inset:0; z-index:1; display:block}
#wallLink:focus-visible{outline-offset:-6px}
.hint{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2); pointer-events:none; transition:color .3s}
body.on-wall .hint{color:var(--ember2)}
@media (hover:none), (max-width:700px){ .hint{display:none} }
.wrap{padding-left:var(--gl); padding-right:var(--gr)}

header.top{display:flex; justify-content:space-between; align-items:center; height:64px}
.mark img{height:28px; width:auto; display:block}
nav{display:flex; gap:clamp(14px,3vw,30px); font-size:14px; font-weight:500; letter-spacing:.02em; color:var(--fg2)} nav a:hover{color:var(--fg)}

.ask{padding-block:clamp(32px,7vh,96px) clamp(24px,4vh,48px)}
.ask h1{margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(32px,5.4vw,76px); line-height:1; letter-spacing:-.03em; max-width:14ch; text-wrap:balance}
.ask p{margin:14px 0 0; font-size:clamp(17px,1.6vw,22px); color:var(--fg2)}
.ask a.arrow{display:inline-block; margin-top:22px; font-family:var(--f-display); font-size:clamp(28px,3vw,40px); line-height:1; transition:transform .5s cubic-bezier(.2,.8,.2,1)} .ask a.arrow:hover{transform:translateX(10px); color:var(--ember2)}

/* the carousel lives inside the carved niche; JS measures the niche on the image and sets these */
.rail{position:fixed; z-index:3; left:var(--nL,16px); width:var(--nW,calc(100% - 32px)); top:var(--nT,50vh); padding:0}
.rail .head{display:flex; justify-content:space-between; align-items:center; gap:16px; height:var(--headH,40px); padding-inline:14px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2)}
.track{display:flex; gap:14px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; padding:0 14px; scrollbar-width:none; overscroll-behavior-x:contain; -webkit-mask:linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); mask:linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent)}
.track::-webkit-scrollbar{display:none}
.tset{display:flex; gap:14px; flex:none}
.tile{flex:none; width:var(--tW,320px); scroll-snap-align:start; display:flex; flex-direction:column; gap:var(--capGap,10px)}
.tile .media{box-shadow:0 10px 18px -8px rgba(0,0,0,.8)}
.tile .media{position:relative; aspect-ratio:16/9; overflow:hidden; background:#0E1114; border:1px solid var(--line); border-radius:6px; transform:translateZ(0)}
.tile .media > *{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.tile video{opacity:0; transition:opacity .3s} .tile.playing video{opacity:1}
.tile .media::after{content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), inset 0 -60px 60px -40px rgba(0,0,0,.6); pointer-events:none}
.tile .cap{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.tile .cap b{font-family:var(--f-display); font-weight:600; font-size:17px; letter-spacing:-.01em}
.tile .cap span{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2)}
.tile .cap span.new{color:var(--ember2)}
.tile.soon{opacity:.45} .tile.soon .media{display:grid; place-items:center; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2)}
.tile:hover .cap b{color:var(--ember2)}
.arrows{display:flex; gap:8px}
.arrows button{width:36px; height:36px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; color:var(--fg2); transition:border-color .3s, color .3s}
.arrows button:hover{border-color:var(--fg); color:var(--fg)}
.arrows svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}

#page > footer{position:fixed; z-index:3; left:0; right:0; bottom:0; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:10px calc(12px + env(safe-area-inset-bottom,0px)); font-size:12px; letter-spacing:.08em; color:var(--fg2)}
#page > footer a:hover{color:var(--fg)}

/* Cursor flame */
#flame{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}
@media (hover:none){ #flame{display:none} }

/* Loader */
#loader{position:fixed; inset:0; z-index:100; background:#050607; display:grid; place-items:center; align-content:center; gap:22px; color:var(--fg); transition:opacity .6s ease, visibility .6s}
#loader.out{opacity:0; visibility:hidden}
#loader .logo{width:min(420px,62vw); height:auto; aspect-ratio:1600/432; display:block; opacity:0; animation:lrise 1.1s cubic-bezier(.2,.8,.2,1) .1s both; -webkit-mask:linear-gradient(100deg, #000 40%, rgba(0,0,0,.35) 50%, #000 60%) 0 0/300% 100%; mask:linear-gradient(100deg, #000 40%, rgba(0,0,0,.35) 50%, #000 60%) 0 0/300% 100%; animation:lrise 1.1s cubic-bezier(.2,.8,.2,1) .1s both, shimmer 2.2s linear 1s infinite}
@keyframes lrise{from{opacity:0; transform:translateY(18px) scale(.96)} to{opacity:1; transform:none}}
@keyframes shimmer{from{-webkit-mask-position:100% 0; mask-position:100% 0} to{-webkit-mask-position:0 0; mask-position:0 0}}
#loader .bar{width:min(320px,60vw); height:1px; background:var(--line); position:relative; overflow:hidden}
#loader .bar i{position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg, var(--ember), var(--ember2)); transition:width .25s ease}
#loader .pct{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg2); font-variant-numeric:tabular-nums}
#page{opacity:0; transform:translateY(12px); transition:opacity .9s ease .15s, transform 1.1s cubic-bezier(.2,.8,.2,1) .15s}
body.ready #page{opacity:1; transform:none}

@media (max-width:760px){ .ask{padding-top:48px} nav{gap:14px} nav a{font-size:13px} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} #flame{display:none} body,a,button{cursor:auto} }

/* ---------- Project pages: quiet, spaced, readable. No flame, normal cursor. ---------- */
#proj{position:relative; z-index:2; display:none; cursor:auto}
body.in-proj{cursor:auto; overflow-y:auto} body.in-proj a, body.in-proj button{cursor:pointer}
body.in-proj #proj{display:block} body.in-proj #page, body.in-proj #wall, body.in-proj #flame, body.in-proj #wallLink{display:none}
#proj .pw{max-width:1440px; margin:0 auto; padding-inline:clamp(20px,5vw,72px)}
#proj .ptop{display:flex; justify-content:space-between; align-items:center; height:72px}
#proj .ptop nav a{color:var(--fg2)} #proj .ptop nav a:hover{color:var(--fg)}
#proj .back{display:inline-block; margin-top:clamp(40px,9vh,110px); font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2); transition:color .3s, transform .4s cubic-bezier(.2,.8,.2,1)}
#proj .back:hover{color:var(--fg); transform:translateX(-4px)}
#proj h1{margin:clamp(18px,3vh,32px) 0 0; font-family:var(--f-display); font-weight:600; font-size:clamp(44px,8.4vw,132px); line-height:.94; letter-spacing:-.04em; text-wrap:balance}
#proj .pinfo{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:clamp(32px,7vw,120px); margin-top:clamp(48px,9vh,120px); padding-top:24px; border-top:1px solid var(--line)}
#proj .lab{display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg2); margin-bottom:14px}
#proj .pdesc p{margin:0 0 1em; max-width:58ch; font-size:clamp(17px,1.35vw,20px); line-height:1.6; color:var(--fg)}
#proj .pdesc p.q{font-family:var(--f-display); font-weight:600; font-size:clamp(22px,2.1vw,30px); line-height:1.25; letter-spacing:-.02em; max-width:24ch; color:var(--ember2)}
#proj .pdesc p.q .by{display:block; margin-top:10px; font-family:var(--f-body); font-weight:400; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2)}
#proj .pdesc p.draft{color:var(--fg2); font-style:italic}
#proj dl{margin:0; display:grid; gap:26px; align-content:start}
#proj dl div{display:grid; grid-template-columns:90px 1fr; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--line)}
#proj dt{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg2); padding-top:3px}
#proj dd{margin:0; font-size:16px} #proj dd a{border-bottom:1px solid var(--line); transition:border-color .3s, color .3s} #proj dd a:hover{color:var(--ember2); border-color:var(--ember2)}
#proj .tags{display:flex; flex-wrap:wrap; gap:8px} #proj .tags span{padding:4px 11px; border:1px solid var(--line); border-radius:99px; font-size:13px}
#proj .phero{margin:clamp(56px,10vh,140px) 0 0; position:relative; aspect-ratio:16/9; background:#0E1114; overflow:hidden; border-radius:4px}
#proj .phero > *{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
#proj .pgal{display:grid; gap:clamp(16px,2.4vw,36px); margin-top:clamp(16px,2.4vw,36px)}
#proj .pgal .row{display:grid; gap:inherit; grid-template-columns:1fr 1fr}
#proj .pgal img{width:100%; height:auto; display:block; border-radius:4px; background:#0E1114}
#proj .reveal{opacity:0; transform:translateY(28px); transition:opacity 1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1)} #proj .reveal.in{opacity:1; transform:none}
#proj .deck{margin-top:clamp(80px,14vh,180px)}
#proj .deck .strip{display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:14px; scrollbar-width:thin; scrollbar-color:var(--line) transparent}
#proj .deck .strip img{flex:none; width:min(78vw,900px); height:auto; scroll-snap-align:start; border-radius:4px; background:#0E1114}
#proj .deck .hint2{font-size:13px; color:var(--fg2); margin-top:8px}
#proj .pmore{margin-top:clamp(110px,18vh,220px); padding-top:24px; border-top:1px solid var(--line)}
#proj .mhead{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:clamp(28px,4vh,48px)}
#proj .mhead h2{margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(28px,3.4vw,48px); letter-spacing:-.03em}
#proj .mhead a{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2)} #proj .mhead a:hover{color:var(--fg)}
#proj .mgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(16px,2vw,28px)}
#proj .card .m{position:relative; aspect-ratio:16/10; overflow:hidden; border-radius:4px; background:#0E1114}
#proj .card .m > *{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .3s}
#proj .card video{opacity:0} #proj .card.playing video{opacity:1} #proj .card:hover .m > *{transform:scale(1.035)}
#proj .card b{display:block; margin-top:14px; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:-.01em; transition:color .3s}
#proj .card:hover b{color:var(--ember2)} #proj .card span{display:block; margin-top:4px; font-size:13px; color:var(--fg2)}
#proj .pfoot{margin-top:clamp(120px,20vh,240px); padding-block:clamp(40px,7vh,80px) calc(28px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line)}
#proj .talk{display:inline-block; font-family:var(--f-display); font-weight:600; font-size:clamp(36px,6.2vw,96px); line-height:1.02; letter-spacing:-.04em; margin:0; max-width:15ch; text-wrap:balance}
#proj .mail{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:26px; font-size:clamp(18px,1.8vw,24px)}
#proj .mail button{font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:7px 13px; border:1px solid var(--line); border-radius:99px; color:var(--fg2); transition:color .3s, border-color .3s}
#proj .mail button:hover{color:var(--fg); border-color:var(--fg)}
#proj .fbar{display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-top:clamp(56px,9vh,110px); font-size:13px; color:var(--fg2)}
#proj .fbar a:hover, #proj .fbar button:hover{color:var(--fg)} #proj .fbar .soc{display:flex; gap:22px}
@media (max-width:820px){ #proj .pinfo{grid-template-columns:1fr} #proj .mgrid{grid-template-columns:1fr 1fr} #proj .mgrid .card:nth-child(3){display:none} }
@media (max-width:520px){ #proj .pgal .row{grid-template-columns:1fr} #proj .mgrid{grid-template-columns:1fr} #proj .mgrid .card:nth-child(3){display:block} #proj dl div{grid-template-columns:72px 1fr} }


/* "Let's create something together": fills with an orange gradient on hover, left to right */
.cta{background-image:linear-gradient(90deg,#FF4D1A,#FF9A3C 55%,#FFD58A), linear-gradient(var(--fg),var(--fg)); background-size:0% 100%, 100% 100%; background-repeat:no-repeat; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; transition:background-size .7s cubic-bezier(.2,.8,.2,1)}
.cta:hover, .cta:focus-visible{background-size:100% 100%, 100% 100%}
#page > footer .cta{font-family:var(--f-display); font-weight:600; font-size:15px; letter-spacing:-.005em}
#page > footer{align-items:baseline}
#page > footer .soc{display:flex; gap:20px} #page > footer .soc a{transition:color .3s}
#page > footer .soc a:hover{color:var(--ember2)}
.soc{align-items:center} .soc a.si{display:grid; place-items:center; width:20px; height:20px; transition:color .3s, transform .4s cubic-bezier(.2,.8,.2,1)} .soc a.si svg{width:18px; height:18px; display:block} .soc a.si:hover{color:var(--ember2); transform:translateY(-2px)}

/* Video player: poster + play button; plays the YouTube film in place */
.player{position:relative; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden}
.player > img, .player > video, .player > iframe{position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; display:block}
.player > video.full{object-fit:contain; background:#000}
.player .play{position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.45)); color:var(--fg)}
.player .play i{width:clamp(64px,8vw,96px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:rgba(7,9,11,.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.28); transition:background .35s, transform .5s cubic-bezier(.2,.8,.2,1), border-color .35s}
.player .play:hover i{background:linear-gradient(135deg,#FF4D1A,#FF9A3C); border-color:transparent; transform:scale(1.07)}
.player .play svg{width:34%; height:34%; margin-left:0; display:block; fill:currentColor}
.player .pnote{position:absolute; left:16px; right:16px; bottom:14px; font-size:13px; color:var(--fg2); text-align:center; pointer-events:none}

/* Views inside the inner pages */
#proj .view{display:none} #proj .view.on{display:block}
#proj .ptop nav a[aria-current="page"]{color:var(--fg)}
body.on-contact #proj .pfoot .talk{display:none}
body.on-contact #proj .pfoot{margin-top:clamp(80px,12vh,140px)} body.on-contact #proj .fbar{margin-top:0}

/* Contact rows: shared by Contact and About */
.clist{display:grid; border-top:1px solid var(--line)}
.crow{display:grid; grid-template-columns:120px 1fr auto; align-items:center; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); font-size:clamp(17px,1.5vw,21px); transition:color .3s}
.crow .lab{margin:0!important}
a.crow:hover{color:var(--ember2)} a.crow .ar{transition:transform .4s cubic-bezier(.2,.8,.2,1)} a.crow:hover .ar{transform:translate(4px,-4px)}
.crow .ar{color:var(--fg2); font-size:18px}
.pill{font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:7px 13px; border:1px solid var(--line); border-radius:99px; color:var(--fg2); transition:color .3s, border-color .3s}
.pill:hover{color:var(--fg); border-color:var(--fg)}

/* Contact page */
#vContact h1{max-width:13ch; font-size:clamp(44px,7.4vw,118px)}
#vContact .lead{margin:clamp(22px,3vh,34px) 0 0; max-width:46ch; font-size:clamp(18px,1.5vw,22px); color:var(--fg2)}
.cgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(40px,7vw,120px); margin-top:clamp(56px,10vh,120px)}
.cform{display:grid; gap:22px; align-content:start}
.cform label{display:grid; gap:8px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg2)}
.cform input, .cform textarea{font:400 18px/1.5 var(--f-body); color:var(--fg); background:transparent; border:0; border-bottom:1px solid var(--line); padding:8px 0 10px; border-radius:0; letter-spacing:0; text-transform:none; transition:border-color .3s}
.cform textarea{resize:vertical; min-height:130px}
.cform input:focus, .cform textarea:focus{outline:none; border-color:var(--ember)}
.cform fieldset{border:0; margin:0; padding:0; display:grid; gap:12px}
.cform legend{padding:0; margin-bottom:12px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg2)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips label{display:block; letter-spacing:0; text-transform:none; font-size:15px}
.chips input{position:absolute; opacity:0; pointer-events:none}
.chips span{display:block; padding:7px 14px; border:1px solid var(--line); border-radius:99px; color:var(--fg2); transition:all .3s}
.chips input:checked + span{color:#120800; background:linear-gradient(90deg,#FF7A2E,#FFC56E); border-color:transparent}
.chips input:focus-visible + span{outline:2px solid var(--ember); outline-offset:3px}
.send{justify-self:start; margin-top:6px; font-family:var(--f-display); font-weight:600; font-size:clamp(22px,2vw,28px); letter-spacing:-.02em; padding:4px 0}
.fnote{margin:0; font-size:14px; color:var(--fg2); max-width:48ch} .fnote:empty{display:none}
.fnote b{color:var(--fg); font-weight:500}

#proj dl{gap:0} #proj dl div{padding:16px 0; border-bottom:1px solid var(--line)} #proj dl div:first-child{padding-top:0}
#proj dd{line-height:1.5}
.atools{margin-top:clamp(32px,5vh,48px)} .atools .tags{display:flex; flex-wrap:wrap; gap:8px} .atools .tags span{padding:5px 12px; border:1px solid var(--line); border-radius:99px; font-size:14px}
/* About page */
.agrid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:clamp(40px,7vw,120px); align-items:start; margin-top:clamp(40px,9vh,110px)}
#vAbout h1{margin-top:0}
.atext p{margin:clamp(22px,3vh,32px) 0 0; max-width:56ch; font-size:clamp(17px,1.4vw,21px); line-height:1.6}
.atext p.draft{color:var(--fg2); font-style:italic}
.aphoto{margin:0; position:relative; aspect-ratio:4/5; border-radius:4px; overflow:hidden; background:#0E1114; border:1px dashed rgba(236,230,216,.22); display:grid; place-items:center; color:var(--fg2); font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.aphoto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.acontact{margin-top:clamp(90px,14vh,170px)}
@media (max-width:820px){ .cgrid, .agrid{grid-template-columns:1fr} .crow{grid-template-columns:96px 1fr auto} }
@media (max-width:520px){ .crow{grid-template-columns:1fr auto} .crow > .lab{grid-column:1 / -1} }


/* ---------- Clean pass (Nov 16): single column, air, no divider lines ---------- */
#proj .pw{max-width:1180px}
#proj .lab{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg2); margin-bottom:10px}
#proj h1{font-size:clamp(44px,7.6vw,112px)}

/* ---------- Flame transition: the fire sweeps in, the page swaps under full cover, the fire burns away ---------- */
const fx = $('#fx'), fxc = fx.getContext('2d'), FX = [], FXN = 24, SWAP = 14;
let fxReady = 0, fxBusy = false;
function preloadFx(){ for (let i = 1; i <= FXN; i++) { const im = new Image(); im.decoding = 'async'; im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => fxReady++); }; im.src = `media/flame/f${String(i).padStart(2, '0')}.webp`; FX[i - 1] = im; } }
function fxDraw(im){

  if (fx.width !== Math.round(w * d)) { fx.width = Math.round(w * d); fx.height = Math.round(h * d); }

  if (!im) return; const s = Math.max(fx.width / 1280, fx.height / 720) * 1.04; // a touch of overscan so no edge peeks through at full cover
  fxc.drawImage(im, (fx.width - 1280 * s) / 2, (fx.height - 720 * s) / 2, 1280 * s, 720 * s);
}
function transition(swap){
  if (fxBusy) return;
  if (reduce || fxReady < FXN) { // fallback: a quick dark dip
    const v = $('#veil'); v.classList.add('on'); fxBusy = true;
    setTimeout(() => { swap(); v.classList.remove('on'); fxBusy = false; }, reduce ? 0 : 300); return;
  }
  fxBusy = true; fx.classList.add('busy'); let i = 0;
  const tick = () => {
    fxDraw(FX[i]);
    if (i === SWAP) swap();
    i++;
    if (i < FXN) setTimeout(tick, 1000 / 30); else { fxDraw(null); fx.classList.remove('busy'); fxBusy = false; }
  };
  tick();
}

/* ---------- The wall: dark stone, lit only where the flame has been ---------- */
const wall = $('#wall'), wx = wall.getContext('2d'); const stone = new Image(); stone.src = 'media/stone.webp';
const litC = document.createElement('canvas'), litX = litC.getContext('2d');   // the image, masked by light
const lightC = document.createElement('canvas'), lightX = lightC.getContext('2d'); // low-res light map
const LS = 4; // light map downscale
let W = 0, H = 0, dpr = 1, cover = null;
function size(){
  dpr = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  wall.width = litC.width = Math.round(W * dpr); wall.height = litC.height = Math.round(H * dpr);
  lightC.width = Math.ceil(W / LS); lightC.height = Math.ceil(H / LS);
  $('#flame').width = Math.round(W * fireDpr()); $('#flame').height = Math.round(H * fireDpr());
  if (stone.naturalWidth) {
    const iw = stone.naturalWidth, ih = stone.naturalHeight, s = Math.max(W / iw, H / ih), k = iw / 2576; // k: map source-pixel landmarks onto this file
    let y = H - 1335 * k * s; y = Math.min(0, Math.max(H - ih * s, y));                                  // keep the ledge just above the bottom edge
    cover = { w: iw * s, h: ih * s, x: (W - iw * s) / 2, y };
    // landmarks measured on the 2576-wide source: niche 762→1168 tall, 165→2455 wide; ledge face 1205→1265
    const nT = y + 762 * k * s + 12, lT = y + 1168 * k * s, fT = y + 1205 * k * s, nL = Math.max(12, cover.x + 165 * k * s), nR = Math.min(W - 12, cover.x + 2455 * k * s);
    const nW = nR - nL, cap = 30;
    let tH = Math.max(80, lT - nT - 4), tW = tH * 16 / 9;
    const maxW = Math.max(160, Math.min(nW - 28, W < 700 ? nW - 60 : 520)); if (tW > maxW) { tW = maxW; tH = tW * 9 / 16; }
    const r = document.documentElement.style;
    r.setProperty('--nL', nL + 'px'); r.setProperty('--nW', nW + 'px'); r.setProperty('--nT', (lT - tH) + 'px'); r.setProperty('--tW', tW + 'px'); r.setProperty('--capGap', Math.max(6, fT - lT) + 'px');
  }
}
function fireDpr(){ return Math.min(devicePixelRatio || 1, 1.25); }
addEventListener('resize', size); stone.onload = size; size();

// Fire: a fluid metaball flame on the GPU, posterized into flat bands with organic holes (cel-animation fire)
const mouse = { x: innerWidth / 2, y: innerHeight * .4, on: false, overRail: false };
const head = { x: mouse.x, y: mouse.y, vx: 0, vy: 0 }, prev = { x: mouse.x, y: mouse.y };
const navBox = () => { const n = document.querySelector(document.body.classList.contains('in-proj') ? '#proj .ptop nav' : 'header.top nav'); return n ? n.getBoundingClientRect() : null; };
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; mouse.overRail = !!e.target.closest('.rail'); const nr = navBox(); const nearNav = nr && e.clientX > nr.left - 28 && e.clientX < nr.right + 28 && e.clientY > nr.top - 22 && e.clientY < nr.bottom + 22;

const AMB = .07, MAXP = 64, MAXE = 16;
const fc = $('#flame'), pts = [], embers = [];

  vec2 w = vec2(fbm(q + vec2(0., uT * 1.7)), fbm(q + vec2(4.7, uT * 2.1))) - .5;
  vec2 p = px + w * 20.;
  float f = 0.;

  vec3 cEdge = vec3(.95, .27, .05), cOr = vec3(1., .52, .08), cYe = vec3(1., .82, .22), cCore = vec3(1., .96, .72);

}
function updateFire(now, dt){
  const t = now / 1000, tiny = mouse.tiny, small = mouse.overRail || tiny;
  const k = small ? .34 : .22, damp = small ? .6 : .72;
  head.vx = (head.vx + (mouse.x - head.x) * k) * damp; head.vy = (head.vy + (mouse.y - head.y) * k) * damp;
  head.x += head.vx; head.y += head.vy;
  const speed = Math.hypot(head.vx, head.vy);
  if (mouse.on) {
    const dist = Math.hypot(head.x - prev.x, head.y - prev.y), n = Math.max(1, Math.min(4, Math.ceil(dist / 9)));
    for (let i = 1; i <= n; i++) {
      const u = i / n;
      pts.push({ x: prev.x + (head.x - prev.x) * u + rnd(-3, 3), y: prev.y + (head.y - prev.y) * u + rnd(-2, 2), r0: (tiny ? 2.6 : small ? 5 : 8.5) * rnd(.85, 1.15), r: 0, age: 0, life: tiny ? rnd(.12, .16) : small ? rnd(.2, .28) : rnd(.42, .58), vx: -head.vx * .05 + rnd(-.35, .35), rise: rnd(85, 130) });
    }
    if (!tiny && Math.random() < (small ? .02 : .07 + Math.min(.18, speed * .012)))
      embers.push({ x: head.x + rnd(-10, 10), y: head.y - rnd(18, 42), vx: rnd(-.9, .9) - head.vx * .08, vy: rnd(-95, -45), r0: rnd(3, 4.8), r: 0, age: 0, life: rnd(.9, 1.6), seed: rnd(0, 6.3) });
  }

  for (let i = embers.length - 1; i >= 0; i--) { const e = embers[i]; e.age += dt / e.life; if (e.age >= 1) { embers.splice(i, 1); continue; } e.vy += 75 * dt; e.x += e.vx + Math.sin(t * 6 + e.seed) * .35; e.y += e.vy * dt; e.r = e.r0 * Math.pow(1 - e.age, .6); }

function renderFire(now){
  if (gl) {
    PB.fill(0); EB.fill(0);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const off = Math.max(0, pts.length - MAXP);
    for (let i = 0; i < Math.min(MAXP, pts.length); i++) { const p = pts[off + i]; PB.set([p.x, p.y, p.r, p.age], i * 4); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    for (let i = 0; i < Math.min(MAXE, embers.length); i++) { const e = embers[i]; EB.set([e.x, e.y, e.r, e.age], i * 4); x0 = Math.min(x0, e.x); x1 = Math.max(x1, e.x); y0 = Math.min(y0, e.y); y1 = Math.max(y1, e.y); }
    gl.disable(gl.SCISSOR_TEST); gl.viewport(0, 0, fc.width, fc.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (x1 < x0) return;
    const d = fc.width / W, m = 150;
    const sx = Math.max(0, Math.floor((x0 - m) * d)), sy = Math.max(0, Math.floor((H - y1 - m) * d)), sw = Math.min(fc.width, Math.ceil((x1 + m) * d)) - sx, shh = Math.min(fc.height, Math.ceil((H - y0 + m * 1.6) * d)) - sy;
    if (sw <= 0 || shh <= 0) return;
    gl.enable(gl.SCISSOR_TEST); gl.scissor(sx, sy, sw, shh);
    gl.uniform2f(U.uRes, fc.width, fc.height); gl.uniform1f(U.uT, now / 1000); gl.uniform1f(U.uD, d);
    gl.uniform4fv(U.uP, PB); gl.uniform4fv(U.uE, EB);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else if (fx2) {
    const d = fc.width / W; fx2.setTransform(d, 0, 0, d, 0, 0); fx2.clearRect(0, 0, W, H);
    if (!mouse.on) return; const g = fx2.createRadialGradient(head.x, head.y - 20, 0, head.x, head.y - 20, 60);
    g.addColorStop(0, 'rgba(255,230,150,.9)'); g.addColorStop(.4, 'rgba(255,140,40,.6)'); g.addColorStop(1, 'rgba(255,80,20,0)'); fx2.fillStyle = g; fx2.fillRect(head.x - 60, head.y - 80, 120, 120);

function drawWall(now, dt){

  const fl = 1 + .09 * Math.sin(t * 11.3) + .06 * Math.sin(t * 6.1 + 1) + .05 * Math.sin(t * 19.7 + 2);
  lightX.globalCompositeOperation = 'destination-out'; lightX.fillStyle = 'rgba(0,0,0,.32)'; lightX.fillRect(0, 0, lightC.width, lightC.height);
  lightX.globalCompositeOperation = 'lighter';
  const blob = (x, y, r, a) => { // tall, soft, warm: firelight, not a beam
    lightX.save(); lightX.translate(x / LS, y / LS); lightX.scale(1, 1.25);
    const g = lightX.createRadialGradient(0, 0, 0, 0, 0, r / LS);
    g.addColorStop(0, `rgba(255,196,120,${a})`); g.addColorStop(.35, `rgba(255,150,70,${a * .55})`); g.addColorStop(.7, `rgba(220,90,30,${a * .18})`); g.addColorStop(1, 'rgba(180,60,20,0)');

  for (let i = 0; i < pts.length; i += 4) { const p = pts[i]; blob(p.x, p.y, 110 + p.r * 5, .045 * (1 - p.age)); }
  for (const e of embers) blob(e.x, e.y, 80 + e.r * 10, .12 * (1 - e.age));

  litX.globalCompositeOperation = 'source-over'; litX.clearRect(0, 0, litC.width, litC.height);
  litX.save(); litX.scale(dpr, dpr); litX.drawImage(stone, cover.x, cover.y, cover.w, cover.h); litX.restore();
  litX.globalCompositeOperation = 'destination-in'; litX.drawImage(lightC, 0, 0, litC.width, litC.height);
  wx.globalCompositeOperation = 'source-over'; wx.fillStyle = '#07090B'; wx.fillRect(0, 0, wall.width, wall.height);

if (!touch && !reduce) initFire();
let last = performance.now(), useTimer = false, alive = false;
function frame(){ const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; if (view !== 'home') { if (!useTimer) requestAnimationFrame(frame); return; } if (!reduce) { if (!touch) updateFire(now, dt); drawWall(now, dt); if (!touch) renderFire(now); } else if (cover) { wx.save(); wx.scale(dpr, dpr); wx.globalAlpha = .35; wx.fillStyle = '#07090B'; wx.fillRect(0, 0, W, H); wx.drawImage(stone, cover.x, cover.y, cover.w, cover.h); wx.restore(); } if (!useTimer) requestAnimationFrame(frame); }

})();
